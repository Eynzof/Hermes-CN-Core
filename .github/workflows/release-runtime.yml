# Build, sign, and stage hermes-agent-cn runtime artifacts that the
# hermes-agent-cn-desktop client downloads on first launch.
#
# Trigger: push a tag matching `runtime-v*-cn.*` (e.g. `runtime-v0.14.0-cn.1`).
# Per-platform jobs build a self-contained executable via PyInstaller,
# zip it, sign the manifest with Ed25519, and attach all artifacts to a
# draft GitHub Release. Promotion happens after final artifact acceptance.
#
# Required repository secrets:
#   RUNTIME_SIGN_PRIVATE_KEY_PEM
#     The Ed25519 PEM-encoded private key. The matching public key is
#     baked into the desktop binary via the HERMES_RUNTIME_UPDATE_PUBLIC_KEY_PEM_DEFAULT
#     env var at build time. See docs/RUNTIME_RELEASES.md.
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#     Developer ID Application signing material for macOS runtime payloads.
# Optional repository variable:
#   RUNTIME_ARTIFACT_BASE_URL
#     HTTPS mirror root; fixed before signing because artifactUrl is signed.
#
# Caveats (track in follow-up issues, not blockers for first run):
#   - PyInstaller's autodetection misses lazy-imported provider SDKs
#     (firecrawl-py, etc.). Add them to hidden-imports as the ecosystem
#     grows. The agent's `tools/lazy_deps.py` install flow won't work inside
#     a frozen binary anyway — only the providers we pre-bake are usable.
#   - Antivirus on Windows flags unsigned PyInstaller output. Free mitigations
#     applied here: --onedir (no self-extracting stub), --noupx (UPX-packed
#     binaries are heavily flagged), and a stamped version-info resource
#     (CompanyName/ProductName/FileVersion). Windows Authenticode is optional;
#     Ed25519 runtime manifest signatures remain mandatory on all platforms.

name: release-runtime

on:
  push:
    tags:
      - "runtime-v*-cn.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version, e.g. 0.14.0-cn.1"
        required: true
      channel:
        description: "Release channel"
        default: stable
        type: choice
        options: [stable, beta, canary]
      artifact_tag:
        description: "Fixed artifact download tag for a manual candidate build (does not publish a Release)"
        required: false

permissions:
  contents: write  # needed to create the Release + upload assets

concurrency:
  group: runtime-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    env:
      RUNTIME_SIGN_PRIVATE_KEY_PEM: ${{ secrets.RUNTIME_SIGN_PRIVATE_KEY_PEM }}
      RUNTIME_ARTIFACT_BASE_URL: ${{ vars.RUNTIME_ARTIFACT_BASE_URL || 'https://hot-update-download.hermesagent.org.cn' }}
      # Node.js LTS bundled into the frozen runtime so the desktop /chat Ink
      # TUI, embedded/external terminal, and node-based MCP/playwright/npx tools
      # work without a host Node install. Bump as new 22.x LTS patches ship.
      # See FORK_NOTES P-032.
      NODE_RUNTIME_VERSION: "22.22.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            ext: .exe
          - runner: macos-latest
            platform: darwin
            arch: arm64
            ext: ""
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            ext: ""
          # Build and smoke-test on the oldest supported glibc baseline.
          # ubuntu-latest can silently raise the runtime's GLIBC requirement.
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            ext: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve runtime version + channel
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_ARTIFACT_TAG: ${{ inputs.artifact_tag }}
        run: |
          test -n "$RUNTIME_SIGN_PRIVATE_KEY_PEM" || { echo "::error::RUNTIME_SIGN_PRIVATE_KEY_PEM is required; unsigned runtime artifacts cannot be released"; exit 1; }
          if [[ -n "$INPUT_VERSION" ]]; then
            RUNTIME_VERSION="$INPUT_VERSION"
            CHANNEL="$INPUT_CHANNEL"
          else
            # Tag is `runtime-v<kernelVersion>-cn.<revision>`; strip the prefix.
            RUNTIME_VERSION="${GITHUB_REF_NAME#runtime-v}"
            CHANNEL="stable"
          fi

          if [[ ! "$RUNTIME_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)-([a-z][a-z0-9]*)\.([1-9][0-9]*)$ ]]; then
            echo "Invalid runtime version: $RUNTIME_VERSION" >&2
            echo "Expected <kernelVersion>-<flavor>.<revision>, e.g. 0.14.0-cn.1" >&2
            exit 1
          fi

          KERNEL_VERSION="${BASH_REMATCH[1]}"
          RUNTIME_FLAVOR="${BASH_REMATCH[3]}"
          RUNTIME_REVISION="${BASH_REMATCH[4]}"
          PYPROJECT_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [[ -z "$PYPROJECT_VERSION" ]]; then
            echo "Cannot find [project].version in pyproject.toml" >&2
            exit 1
          fi
          if [[ "$PYPROJECT_VERSION" != "$KERNEL_VERSION" ]]; then
            echo "Tag kernel version $KERNEL_VERSION does not match pyproject.toml version $PYPROJECT_VERSION" >&2
            exit 1
          fi

          # Dispatch builds anticipate the final tag without publishing it.
          # The mirror uses /<tag>/<asset>, never a mutable latest URL.
          ARTIFACT_TAG="${INPUT_ARTIFACT_TAG:-runtime-v$RUNTIME_VERSION}"
          git check-ref-format "refs/tags/$ARTIFACT_TAG"
          case "$RUNTIME_ARTIFACT_BASE_URL" in
            https://*) ;;
            *) echo "::error::RUNTIME_ARTIFACT_BASE_URL must use HTTPS"; exit 1 ;;
          esac

          echo "runtime_version=$RUNTIME_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime_flavor=$RUNTIME_FLAVOR" >> "$GITHUB_OUTPUT"
          echo "runtime_revision=$RUNTIME_REVISION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "artifact_tag=$ARTIFACT_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set macOS 14 deployment target
        if: matrix.platform == 'darwin'
        shell: bash
        run: echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install build deps + agent
        shell: bash
        run: |
          # Install the exact locked dependency set used by main CI. This must
          # use uv rather than bare pip: the project intentionally overrides
          # incompatible transitive caps (for example cryptography 50 with the
          # current Alibaba SDK), and pip does not honor [tool.uv] overrides.
          # A fresh pip resolution silently downgraded alibabacloud-tea-openapi
          # and omitted darabonba-core, then PyInstaller failed while copying
          # that package's metadata.
          sync_args=()
          if [[ "${{ matrix.platform }}-${{ matrix.arch }}" == "darwin-x64" ]]; then
            # PyPI has no ORT cp314 Intel macOS wheel. Keep the same locked
            # dependency graph; install our pinned-source wheel immediately
            # below instead of dropping local speech recognition.
            sync_args+=(--no-install-package onnxruntime)
          fi
          uv sync --locked --python 3.14 --extra cn-desktop "${sync_args[@]}"

          # Install packaging-only tooling into that same locked environment.
          uv pip install --python .venv "pyinstaller==6.*"

          # GITHUB_PATH applies to subsequent steps. Resolve the interpreter
          # directory through uv so this is correct for POSIX bin/ and Windows
          # Scripts/ layouts without maintaining two path branches.
          uv run --no-sync python -c 'import os, sys; print(os.path.dirname(sys.executable))' >> "$GITHUB_PATH"

          # The `cn-desktop` aggregate extra pre-bakes every backend the frozen
          # runtime exposes: dashboard (web), the Anthropic transport (MiniMax-CN
          # rides on Anthropic Messages), the native MCP client (issue #16), and
          # the 飞书 / 钉钉 / 企业微信 / 微信 IM adapters. The frozen binary CANNOT
          # lazy-install via tools/lazy_deps.py (no working pip inside a
          # PyInstaller binary), so anything not bundled here is simply
          # unavailable at runtime — and `pip install <pkg>` on the host does NOT
          # help, since the frozen runtime ships its own interpreter + packages.
          # Keep this in sync with the cn-desktop extra in pyproject.toml.

      - name: Cache Intel macOS ONNX Runtime wheel
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        id: intel-ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/onnxruntime-intel-wheel
          key: ort-1.27.0-8f0278c77bf44b0cc83c098c6c722b92a36ac4b5-cp314-macos14-x64-${{ hashFiles('scripts/build_macos_intel_onnxruntime.sh') }}

      - name: Build Intel macOS ONNX Runtime wheel
        if: matrix.platform == 'darwin' && matrix.arch == 'x64' && steps.intel-ort-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          uv pip install --python .venv "wheel==0.45.1"
          bash scripts/build_macos_intel_onnxruntime.sh "$PWD/.venv/bin/python" "$RUNNER_TEMP/onnxruntime-intel-wheel"

      - name: Install and verify Intel local speech dependencies
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        shell: bash
        run: |
          python - "$RUNNER_TEMP/onnxruntime-intel-wheel" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          record = json.loads((root / "build-record.json").read_text())
          assert record["sourceCommit"] == "8f0278c77bf44b0cc83c098c6c722b92a36ac4b5"
          with (root / record["wheel"]).open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == record["sha256"]
          PY
          uv pip install --python .venv --no-deps "$RUNNER_TEMP"/onnxruntime-intel-wheel/*.whl
          python scripts/smoke_runtime_voice.py
          mkdir -p diagnostics
          cp "$RUNNER_TEMP/onnxruntime-intel-wheel/build-record.json" diagnostics/onnxruntime-intel-build-record.json

      - name: Set up Node.js (build web dashboard + TUI bundle)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Node.js workspace deps
        shell: bash
        run: npm ci

      - name: Build web dashboard
        shell: bash
        run: |
          # The desktop runtime serves the dashboard/API bundle from
          # hermes_cli/web_dist. Build it before PyInstaller so collect-data
          # includes the actual SPA instead of shipping an empty backend-only
          # runtime (issue #116).
          npm --workspace web run build
          test -f hermes_cli/web_dist/index.html || { echo "::error::hermes_cli/web_dist/index.html not built" >&2; exit 1; }

      - name: Build embedded TUI bundle
        shell: bash
        run: |
          # The desktop /chat pane and embedded terminal reuse the Ink TUI over
          # a PTY (hermes_cli/web_server.py pty_ws). Build the self-contained
          # esbuild bundle (ui-tui/scripts/build.mjs) and stage it into the
          # runtime payload below so the frozen runtime launches it without a
          # ui-tui/ source checkout. Mirrors the PyPI wheel pipeline
          # (upload_to_pypi.yml). See FORK_NOTES P-032.
          npm --workspace ui-tui run build
          test -f ui-tui/dist/entry.js || { echo "::error::ui-tui/dist/entry.js not built" >&2; exit 1; }

      - name: Verify platform backends importable (build env)
        shell: bash
        run: |
          # Fail the build BEFORE PyInstaller if the cn-desktop extra is missing
          # a dependency — this is the exact failure mode behind issue #16 (MCP)
          # and the Feishu/DingTalk/WeCom/WeChat desktop reports, where an
          # adapter silently degraded because its SDK was never installed.
          python - <<'PY'
          import importlib, sys
          missing = []
          for m in ("mcp", "lark_oapi", "dingtalk_stream", "alibabacloud_dingtalk",
                    "alibabacloud_tea_openapi", "alibabacloud_tea_util",
                    "aiohttp", "qrcode", "defusedxml", "certifi", "typer",
                    "hindsight_client", "hindsight_client_api", "aiohttp_retry",
                    "supermemory", "mem0", "ddgs", "exa_py", "firecrawl", "parallel"):
              try:
                  importlib.import_module(m)
              except Exception as e:
                  missing.append(f"{m}: {type(e).__name__}: {e}")
          try:
              from cryptography.hazmat.primitives.ciphers import Cipher  # weixin/wecom AES
          except Exception as e:
              missing.append(f"cryptography: {e}")
          # The 飞书/钉钉/企微 adapters moved from gateway/platforms/*.py to
          # bundled plugins (plugins/platforms/<name>/) in the upstream sync —
          # see FORK_NOTES P-035. weixin (微信个人号, CN-only) was NOT migrated
          # and still lives in gateway/platforms/weixin.py. Import each adapter
          # from its current location and assert its SDK-availability flag, so a
          # missing IM SDK still fails the build BEFORE PyInstaller.
          import plugins.platforms.feishu.adapter as fs
          import plugins.platforms.dingtalk.adapter as dt
          import plugins.platforms.wecom.adapter as wcm
          import plugins.platforms.wecom.callback_adapter as wc
          import gateway.platforms.weixin as wx
          feishu_available = fs._load_lark_oapi()
          for m in (
              "tools.computer_use_tool",
              "tools.computer_use.tool",
              "tools.computer_use.doctor",
              "tools.computer_use.cua_backend",
              "plugins.web.brave_free",
              "plugins.web.ddgs",
              "plugins.web.exa",
              "plugins.web.firecrawl",
              "plugins.web.parallel",
              "plugins.web.searxng",
              "plugins.web.xai",
          ):
              try:
                  importlib.import_module(m)
              except Exception as e:
                  missing.append(f"{m}: {type(e).__name__}: {e}")
          flags = {
              "feishu.FEISHU_AVAILABLE": feishu_available and fs.FEISHU_AVAILABLE,
              "dingtalk.DINGTALK_STREAM_AVAILABLE": dt.DINGTALK_STREAM_AVAILABLE,
              "dingtalk.CARD_SDK_AVAILABLE": dt.CARD_SDK_AVAILABLE,
              "wecom.AIOHTTP_AVAILABLE": wcm.AIOHTTP_AVAILABLE,
              "wecom_callback.DEFUSEDXML_AVAILABLE": wc.DEFUSEDXML_AVAILABLE,
              "wecom_callback.AIOHTTP_AVAILABLE": wc.AIOHTTP_AVAILABLE,
              "weixin.AIOHTTP_AVAILABLE": wx.AIOHTTP_AVAILABLE,
              "weixin.CRYPTO_AVAILABLE": wx.CRYPTO_AVAILABLE,
          }
          for k, v in flags.items():
              print(("OK   " if v else "FAIL ") + k)
              if not v:
                  missing.append(f"adapter flag {k} is False")
          if missing:
              print("\n=== build env is missing CN desktop backends ===", *missing, sep="\n")
              sys.exit(1)
          print("\nAll CN desktop platform backends importable in the build env")
          PY

      - name: Generate Windows version-info resource
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          # Stamp CompanyName / ProductName / FileVersion onto the .exe. An
          # unsigned PyInstaller binary with no version resource trips antivirus
          # heuristics more readily; this is a free, signing-independent
          # mitigation. See docs/windows-antivirus.md.
          python scripts/gen_win_version_info.py \
            --kernel-version "${{ steps.meta.outputs.kernel_version }}" \
            --runtime-version "${{ steps.meta.outputs.runtime_version }}" \
            --output runtime_version_info.txt
          echo "VERSION_FILE_ARG=--version-file runtime_version_info.txt" >> "$GITHUB_ENV"

      - name: Build self-contained executable
        shell: bash
        run: |
          # --onedir gives us a folder with shared libs + the binary; the
          # client expects an executable named hermes-agent-cn-runtime-<platform>-<arch>{.ext}.
          # Hidden imports cover modules PyInstaller doesn't discover via
          # static analysis (lazy imports inside hermes_cli/main.py).
          # The cn-desktop runtime cannot lazy-install packages after freezing,
          # so collect both the direct backend packages and the cross-platform
          # transitive SDK packages those backends load dynamically.
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          pyinstaller --noconfirm \
            --name "$NAME" \
            --onedir \
            --console \
            --noupx \
            ${VERSION_FILE_ARG:-} \
            --collect-all edge_tts \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all onnxruntime \
            --collect-all av \
            --collect-all tokenizers \
            --collect-all sounddevice \
            --collect-all nemo_relay \
            --collect-submodules email \
            --hidden-import imaplib \
            --hidden-import smtplib \
            --hidden-import filecmp \
            --add-data "optional-mcps:optional-mcps" \
            --collect-submodules hermes_cli \
            --collect-submodules tui_gateway \
            --collect-submodules fastapi \
            --collect-submodules starlette \
            --collect-submodules uvicorn \
            --collect-submodules pydantic \
            --collect-submodules anthropic \
            --collect-submodules mcp \
            --collect-submodules tools \
            --collect-submodules plugins.web \
            --collect-submodules plugins.dashboard_auth \
            --collect-submodules plugins.image_gen \
            --collect-submodules ddgs \
            --collect-submodules exa_py \
            --collect-submodules firecrawl \
            --collect-submodules parallel \
            --collect-submodules lark_oapi \
            --collect-submodules dingtalk_stream \
            --collect-submodules alibabacloud_dingtalk \
            --collect-submodules alibabacloud_tea_openapi \
            --collect-submodules alibabacloud_tea_util \
            --collect-submodules alibabacloud_endpoint_util \
            --collect-submodules alibabacloud_gateway_dingtalk \
            --collect-submodules alibabacloud_gateway_spi \
            --collect-submodules alibabacloud_credentials \
            --collect-submodules alibabacloud_credentials_api \
            --collect-submodules alibabacloud_openapi_util \
            --collect-submodules Tea \
            --collect-submodules darabonba \
            --collect-submodules requests_toolbelt \
            --collect-submodules aiohttp \
            --collect-submodules websockets \
            --collect-submodules apscheduler \
            --collect-submodules aiofiles \
            --collect-submodules qrcode \
            --collect-submodules png \
            --collect-submodules defusedxml \
            --collect-submodules cryptography \
            --collect-submodules certifi \
            --collect-submodules typer \
            --collect-submodules hindsight_client \
            --collect-submodules hindsight_client_api \
            --collect-submodules aiohttp_retry \
            --hidden-import tools.lazy_deps \
            --collect-submodules supermemory \
            --collect-submodules mem0 \
            --collect-submodules plugins.memory \
            --collect-data hermes_cli \
            --collect-data gateway \
            --collect-data plugins \
            --collect-data agent \
            --hidden-import gateway.status \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --copy-metadata fastapi \
            --copy-metadata starlette \
            --copy-metadata uvicorn \
            --copy-metadata pydantic \
            --copy-metadata anthropic \
            --copy-metadata mcp \
            --copy-metadata ddgs \
            --copy-metadata exa-py \
            --copy-metadata firecrawl-py \
            --copy-metadata parallel-web \
            --copy-metadata typer \
            --copy-metadata hindsight-client \
            --copy-metadata aiohttp-retry \
            --copy-metadata supermemory \
            --copy-metadata mem0ai \
            --copy-metadata lark_oapi \
            --copy-metadata dingtalk_stream \
            --copy-metadata alibabacloud_dingtalk \
            --copy-metadata alibabacloud_tea_openapi \
            --copy-metadata alibabacloud_tea_util \
            --copy-metadata alibabacloud_endpoint_util \
            --copy-metadata alibabacloud_gateway_dingtalk \
            --copy-metadata alibabacloud_gateway_spi \
            --copy-metadata alibabacloud_credentials \
            --copy-metadata alibabacloud_credentials_api \
            --copy-metadata alibabacloud_openapi_util \
            --copy-metadata alibabacloud_tea \
            --copy-metadata darabonba_core \
            --copy-metadata requests_toolbelt \
            --copy-metadata aiohttp \
            --copy-metadata websockets \
            --copy-metadata apscheduler \
            --copy-metadata aiofiles \
            --copy-metadata qrcode \
            --copy-metadata pypng \
            --copy-metadata defusedxml \
            --copy-metadata cryptography \
            --copy-metadata pycryptodome \
            --copy-metadata certifi \
            --paths . \
            -p . \
            hermes_cli/main.py
          ls -la "dist/$NAME"

      - name: Stage bundled Node runtime + TUI into payload
        shell: bash
        run: |
          # Place the Node LTS runtime and the prebuilt Ink TUI bundle INTO the
          # runtime payload BEFORE macOS normalize/sign so the node binary is
          # codesigned (sign_macos_runtime_payload.sh signs every Mach-O) and
          # the Ed25519 manifest (signed over the whole zip) covers them.
          # Layout the desktop resolves (Hermes-CN-Desktop process/runtime.rs):
          #   POSIX:   <root>/node/bin/{node,npm,npx} + <root>/node/lib/node_modules/npm
          #   Windows: <root>/node/{node.exe,npm.cmd,npx.cmd} + <root>/node/node_modules/npm
          #   TUI:     <root>/tui/dist/entry.js   (pointed at via HERMES_TUI_DIR)
          # See FORK_NOTES P-032.
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          ver="$NODE_RUNTIME_VERSION"
          case "${{ matrix.platform }}-${{ matrix.arch }}" in
            darwin-arm64) pkg="node-v$ver-darwin-arm64"; ar="tar.gz" ;;
            darwin-x64)   pkg="node-v$ver-darwin-x64";   ar="tar.gz" ;;
            linux-x64)    pkg="node-v$ver-linux-x64";    ar="tar.xz" ;;
            win32-x64)    pkg="node-v$ver-win-x64";      ar="zip"    ;;
            *) echo "::error::unmapped platform ${{ matrix.platform }}-${{ matrix.arch }} for node download" >&2; exit 1 ;;
          esac
          url="https://nodejs.org/dist/v$ver/$pkg.$ar"
          echo "Downloading $url"
          curl -fsSL --retry 3 -o "node_dist.$ar" "$url"

          dest="dist/$NAME/node"
          mkdir -p "$dest"
          if [[ "$ar" == "zip" ]]; then
            # Windows: node.exe + npm.cmd/npx.cmd + node_modules/npm at zip root.
            unzip -q "node_dist.$ar"
            cp -R "$pkg"/. "$dest"/
          else
            tar -xf "node_dist.$ar"
            # POSIX: keep bin/ + lib/ (drop include/ + share/ to slim payload);
            # cp -R preserves the bin/{npm,npx} symlinks into lib/node_modules.
            cp -R "$pkg/bin" "$dest/bin"
            cp -R "$pkg/lib" "$dest/lib"
          fi

          mkdir -p "dist/$NAME/tui/dist"
          cp ui-tui/dist/entry.js "dist/$NAME/tui/dist/entry.js"

          echo "Staged node + TUI into dist/$NAME:"
          ls -la "$dest"

      - name: Stage bundled plugin/tool resources into payload
        shell: bash
        run: |
          # PyInstaller's module graph makes code importable, but several
          # Hermes discovery paths intentionally inspect files on disk
          # (tool shims, plugin manifests, provider.py). Stage the declared
          # Desktop runtime resources into _internal so the frozen runtime's
          # advertised tool/plugin inventory matches the payload.
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          internal="dist/$NAME/_internal"
          # Runtime-only updates must carry resources from their own commit.
          # --collect-data excludes Python sources, while PluginManager loads
          # __init__.py from disk. Do not depend on an older Desktop installer
          # to supply plugin code or skills (CN #174).
          python - "$internal" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          internal = Path(sys.argv[1])
          # Built-in discovery also scans tools/*.py and parses their AST.
          # Importable bytecode alone leaves tools such as clarify invisible.
          for category in ("plugins", "skills", "tools"):
              shutil.copytree(
                  category, internal / category, dirs_exist_ok=True,
                  ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "node_modules", ".git"),
              )
          if sys.platform == "win32":
              import winpty
              # pywinpty's ConPTY backend needs its matching OpenConsole host.
              # PyInstaller collects the DLLs but misses these helper programs.
              source = Path(winpty.__file__).parent
              for name in ("OpenConsole.exe", "winpty-agent.exe"):
                  shutil.copy2(source / name, internal / "winpty" / name)
          PY

          test -f "$internal/tools/computer_use_tool.py" || { echo "::error::missing computer_use tool shim" >&2; exit 1; }
          test -f "$internal/tools/computer_use/tool.py" || { echo "::error::missing computer_use package" >&2; exit 1; }
          for p in brave_free ddgs exa firecrawl parallel searxng xai; do
            test -f "$internal/plugins/web/$p/__init__.py" || { echo "::error::missing web plugin $p __init__.py" >&2; exit 1; }
            test -f "$internal/plugins/web/$p/provider.py" || { echo "::error::missing web plugin $p provider.py" >&2; exit 1; }
            test -f "$internal/plugins/web/$p/plugin.yaml" || { echo "::error::missing web plugin $p plugin.yaml" >&2; exit 1; }
          done

          HERMES_HOME="$RUNNER_TEMP/hermes-tools-smoke" "./dist/$NAME/$NAME${{ matrix.ext }}" __run-script scripts/smoke_runtime_tools.py

      - name: Normalize macOS framework layout
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          python scripts/normalize_macos_pyinstaller_runtime.py "dist/$NAME"

      - name: Prepare macOS signing credentials
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"

          signing_keychain_password="$(uuidgen)"
          signing_keychain="$RUNNER_TEMP/hermes-runtime-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/hermes-runtime-apple-certificate.p12"

          security create-keychain -p "$signing_keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$signing_keychain_password" "$signing_keychain"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$signing_keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$signing_keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$signing_keychain"

      - name: Sign macOS runtime payload
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          scripts/sign_macos_runtime_payload.sh "dist/$NAME"

      - name: Record macOS binary deployment requirements
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          python scripts/audit_macos_deployment_targets.py "dist/$NAME" --output "diagnostics/macos-${{ matrix.arch }}-deployment-targets.json" --max-minimum 14.0

      - name: Verify frozen runtime backends
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          internal="dist/$NAME/_internal"
          # Every backend bundled via the cn-desktop extra must leave its
          # dist-info in the frozen output. A missing one means PyInstaller did
          # not collect the package — the silent-degradation failure mode from
          # issue #16 (MCP) and the 飞书/钉钉/企微/微信 desktop reports, where an
          # adapter quietly fell back to "unavailable" because its SDK never
          # shipped. dist-info names are the normalized (underscored) project
          # names: anthropic, mcp, lark-oapi -> lark_oapi, etc.
          fail=0
          for pkg in anthropic mcp typer lark_oapi dingtalk_stream alibabacloud_dingtalk \
                     alibabacloud_tea_openapi alibabacloud_tea_util \
                     alibabacloud_endpoint_util alibabacloud_gateway_dingtalk \
                     alibabacloud_gateway_spi alibabacloud_credentials \
                     alibabacloud_credentials_api alibabacloud_openapi_util \
                     alibabacloud_tea darabonba_core requests_toolbelt \
                     aiohttp websockets apscheduler aiofiles qrcode pypng \
                     defusedxml cryptography pycryptodome certifi \
                     hindsight_client aiohttp_retry \
                     supermemory mem0ai ddgs exa_py firecrawl_py \
                     parallel_web; do
            if [[ -z "$(find "$internal" -maxdepth 1 -type d -name "${pkg}-*.dist-info" -print -quit)" ]]; then
              echo "::error::Frozen runtime is missing ${pkg} package metadata" >&2
              find "dist/$NAME" -maxdepth 3 -type d -iname "${pkg}*" -print >&2
              fail=1
            fi
          done
          [[ "$fail" == 0 ]] || exit 1
          echo "All cn-desktop backends present in the frozen runtime"

      - name: Verify bundled models.dev snapshot present
        shell: bash
        run: |
          # P-028: the offline-first snapshot must ship in the frozen runtime
          # so the cost guard / capability / context-length lookups never stall
          # on models.dev (e.g. from mainland China). Assert it exists and is a
          # non-empty JSON object — NOT its contents (no change-detector).
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          snap="$(find "dist/$NAME" -path '*/agent/models_dev_snapshot.json' -print -quit)"
          if [[ -z "$snap" ]]; then
            echo "::error::Frozen runtime is missing agent/models_dev_snapshot.json" >&2
            exit 1
          fi
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d, dict) and d, 'snapshot empty'; print('models.dev snapshot OK:', len(d), 'providers')" "$snap"

      - name: Verify frozen runtime resources
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          root="dist/$NAME"
          internal="$root/_internal"

          test -f "$internal/hermes_cli/web_dist/index.html" || { echo "::error::missing hermes_cli/web_dist/index.html" >&2; exit 1; }
          test -f "$internal/tools/computer_use_tool.py" || { echo "::error::missing tools/computer_use_tool.py" >&2; exit 1; }
          test -f "$internal/tools/computer_use/tool.py" || { echo "::error::missing tools/computer_use/tool.py" >&2; exit 1; }
          for p in brave_free ddgs exa firecrawl parallel searxng xai; do
            for f in __init__.py provider.py plugin.yaml; do
              test -f "$internal/plugins/web/$p/$f" || { echo "::error::missing plugins/web/$p/$f" >&2; exit 1; }
            done
          done

      - name: Smoke-test the binary
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          "./dist/$NAME/$NAME${{ matrix.ext }}" dashboard --help
          "./dist/$NAME/$NAME${{ matrix.ext }}" tools list --platform cli
          # cua-driver is installed by the user on first use, not bundled.
          # Its documented "not installed" state is valid on a fresh machine;
          # import failures and other command errors must still fail the build.
          status_code=0
          status_output="$("./dist/$NAME/$NAME${{ matrix.ext }}" computer-use status 2>&1)" || status_code=$?
          printf '%s\n' "$status_output"
          if [[ "$status_code" != 0 ]]; then
            if [[ "$status_code" != 1 ]] || ! grep -Fxq 'cua-driver: not installed' <<< "$status_output"; then
              exit "$status_code"
            fi
          fi

      - name: Verify frozen local speech dependencies
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          HERMES_HOME="$RUNNER_TEMP/hermes-voice-smoke" "./dist/$NAME/$NAME${{ matrix.ext }}" __run-script scripts/smoke_runtime_voice.py

      - name: Verify frozen auth and image provider registration
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          binary="$(pwd)/dist/$NAME/$NAME${{ matrix.ext }}"
          plugins="$(pwd)/dist/$NAME/_internal/plugins"
          smoke_home="$RUNNER_TEMP/hermes-provider-smoke"
          mkdir -p "$smoke_home"
          cd "$smoke_home"
          # Doctor imports and registers through the real PluginManager in the
          # frozen process, with outbound connections blocked. Check the actual
          # packaged sources, not this checkout or dist-info directories.
          for provider in dashboard_auth/basic dashboard_auth/nous dashboard_auth/self_hosted \
            image_gen/openai-codex image_gen/openrouter image_gen/xai image_gen/fal; do
            HERMES_HOME="$smoke_home" HERMES_ENABLE_PROJECT_PLUGINS=0 \
              "$binary" plugins doctor "$plugins/$provider" --ci
          done

      - name: Verify frozen memory provider discovery
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          binary="./dist/$NAME/$NAME${{ matrix.ext }}"
          smoke_home="$RUNNER_TEMP/hermes-memory-provider-smoke"
          mkdir -p "$smoke_home"

          for provider in openviking hindsight; do
            printf 'memory:\n  provider: %s\n' "$provider" > "$smoke_home/config.yaml"
            output="$(HERMES_HOME="$smoke_home" "$binary" memory status)"
            printf '%s\n' "$output"
            grep -F "Provider:  $provider" <<< "$output"
            grep -F "Plugin:    installed" <<< "$output"
          done

      - name: Verify bundled Node runtime + TUI
        shell: bash
        run: |
          # The desktop /chat + terminal need a runnable node and the prebuilt
          # TUI inside the payload; assert both rather than discover the gap on
          # a user's machine as "Chat unavailable: 1". See FORK_NOTES P-032.
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          root="dist/$NAME"
          test -f "$root/tui/dist/entry.js" || { echo "::error::missing $root/tui/dist/entry.js" >&2; exit 1; }
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            node_bin="$root/node/node.exe"; npm_bin="$root/node/npm.cmd"; npx_bin="$root/node/npx.cmd"
          else
            node_bin="$root/node/bin/node"; npm_bin="$root/node/bin/npm"; npx_bin="$root/node/bin/npx"
          fi
          "$node_bin" --version
          "$npm_bin" --version
          "$npx_bin" --version
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            HERMES_HOME="$RUNNER_TEMP/hermes-pty-smoke" "$root/$NAME.exe" __run-script scripts/smoke_runtime_windows_pty.py
          fi
          echo "Bundled node + npm + npx + TUI present in $root"

      - name: Zip artifact
        shell: bash
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p out
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            # PowerShell Compress-Archive on Windows runner
            powershell -Command "Compress-Archive -Path dist/$NAME/* -DestinationPath out/$NAME.zip -Force"
          elif [[ "${{ matrix.platform }}" == "darwin" ]]; then
            # Preserve framework symlinks. Without -y, Info-ZIP stores the
            # symlink targets as duplicate files and breaks codesign/notary.
            (cd dist && zip -r -y "../out/$NAME.zip" "$NAME")
          else
            # -y preserves the bundled node bin/{npm,npx} symlinks (Linux);
            # without it Info-ZIP would store them as dereferenced copies.
            (cd dist && zip -r -y "../out/$NAME.zip" "$NAME")
          fi
          ls -la out

      - name: Sign manifest
        shell: bash
        env:
          RUNTIME_ARTIFACT_TAG: ${{ steps.meta.outputs.artifact_tag }}
        run: |
          NAME="hermes-agent-cn-runtime-${{ matrix.platform }}-${{ matrix.arch }}"
          # Anticipate the URL the Release will publish at — this has to
          # match exactly because the signature covers it.
          git check-ref-format "refs/tags/$RUNTIME_ARTIFACT_TAG"
          URL="${RUNTIME_ARTIFACT_BASE_URL%/}/${RUNTIME_ARTIFACT_TAG}/${NAME}.zip"
          python scripts/sign_runtime_manifest.py \
            --channel "${{ steps.meta.outputs.channel }}" \
            --runtime-version "${{ steps.meta.outputs.runtime_version }}" \
            --kernel-version "${{ steps.meta.outputs.kernel_version }}" \
            --runtime-flavor "${{ steps.meta.outputs.runtime_flavor }}" \
            --runtime-revision "${{ steps.meta.outputs.runtime_revision }}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --artifact-url "$URL" \
            --artifact-path "out/$NAME.zip" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --output "out/${{ steps.meta.outputs.channel }}-${{ matrix.platform }}-${{ matrix.arch }}.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

      - name: Upload macOS deployment report
        if: always() && matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-runtime-darwin-${{ matrix.arch }}
          path: diagnostics/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: runtime-*

      - name: Verify complete signed release set
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          expected = {("win32", "x64"), ("darwin", "arm64"), ("darwin", "x64"), ("linux", "x64")}
          manifests = list(root.glob("runtime-*/*.json"))
          assert len(manifests) == len(expected), "expected four signed runtime manifests"
          identities = set()
          for path in manifests:
              manifest = json.loads(path.read_text())
              target = (manifest["platform"], manifest["arch"])
              assert target in expected, f"duplicate or unexpected target: {target}"
              expected.remove(target)
              assert manifest["schemaVersion"] == 2 and manifest["signature"], f"unsigned or incompatible manifest: {path}"
              archive = path.parent / f"hermes-agent-cn-runtime-{target[0]}-{target[1]}.zip"
              with archive.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              assert digest == manifest["sha256"], f"archive changed after signing: {archive}"
              identities.add((manifest["runtimeVersion"], manifest["channel"], manifest["sourceCommit"]))
          assert not expected and len(identities) == 1, "runtime artifacts do not share one release identity"
          print("All four signed runtime archives and manifests are complete")
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          # When running via workflow_dispatch there is no tag — skip the
          # release step in that case (still useful for testing the build).
          tag_name: ${{ github.ref_name }}
          files: |
            dist/**/*.zip
            dist/**/*.json
          fail_on_unmatched_files: true
          draft: true
          make_latest: "false"
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        if: startsWith(github.ref, 'refs/tags/runtime-v')
