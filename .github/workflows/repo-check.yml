name: repo-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repo-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: repo metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # This fork keeps a single README plus the fork patch registry: the docs
      # site, the translated READMEs and the contributor guides are deleted
      # (scripts/upstream-deletions.txt), so a link to one of them is now a
      # broken link rather than a translation hop.
      - name: Check README stays self-contained
        run: |
          set -euo pipefail
          grep -q 'FORK_NOTES.md' README.md
          grep -q 'scripts/install.ps1' README.md
          ! grep -qE 'README\.(zh-CN|en|es|ur-pk)\.md|FORK_NOTES\.zh-CN\.md|CONTRIBUTING\.md|CODE_OF_CONDUCT\.md' README.md

      - name: Check for local private workspace references
        run: |
          set -euo pipefail
          ! git grep -n -I -E '青岛|极鲸|万德|wanderminds|geekbi|李嘉乐|/Users/enzo|私有项目|仅限授权使用|竞品分析' -- \
            README.md SECURITY.md FORK_NOTES.md MAINTAINING.md AGENTS.md CLAUDE.md
