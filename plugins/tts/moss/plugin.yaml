name: moss
version: 1.0.0
description: "Moss (mosi.cn) TTS backend — single-voice text_to_speech (sync + streaming) plus dialogue / voice design / voice clone tools. Key via MOSS_API_KEY, config.yaml `tts.moss.api_key`, `hermes auth add moss`, or a key file configured via `MOSS_KEY_FILE`."
author: Hermes-CN-Core fork
kind: backend
provides_tools:
  - moss_dialogue_tts
  - moss_voice_design
  - moss_voice_clone
  - moss_voice_list
requires_env:
  - MOSS_API_KEY
